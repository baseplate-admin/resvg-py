# Hand-maintained; `maturin generate-ci` would drop the ABI matrix below.
#
#   family   wheel tag          supports                                 built by
#   abi3     cp310-abi3         GIL CPython 3.10+                        3.14
#   cp314t   cp314-cp314t       free-threaded 3.14 (predates abi3t)      3.14t
#   abi3t    cp315-abi3.abi3t   GIL and free-threaded 3.15+, and later   3.15t
#
# The abi3 floor is the `abi3-py310` Cargo feature, not the build interpreter, which is why the abi3
# leg builds with 3.14: Windows on ARM has no CPython before 3.11. PyPy has no stable ABI (cpyext
# emulates the full C API, not the limited one), so it keeps a version-specific leg.
#
# One interpreter per job, never `--find-interpreter`: under abi3 every interpreter emits the same
# wheel filename, and same-named wheels merged across artifacts can concatenate into a ZIP PyPI
# rejects (CVE-2025-54368).
name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: linux ${{ matrix.platform.target }} ${{ matrix.abi.name }}
    runs-on: ${{ matrix.platform.runner }}
    # Advisory until every manylinux image ships python3.15t; only x86_64/i686 have it today.
    continue-on-error: ${{ matrix.abi.tag == 'abi3t' && !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
          - runner: ubuntu-22.04
            target: s390x
          - runner: ubuntu-22.04
            target: ppc64le
        abi:
          - { tag: abi3, name: "abi3 (GIL 3.10+)", interpreter: python3.14 }
          - { tag: cp314t, name: "cp314t (free-threaded 3.14)", interpreter: python3.14t }
          - { tag: abi3t, name: "abi3t (3.15+, GIL and free-threaded)", interpreter: python3.15t }
          - { tag: pypy311, name: "pypy3.11", interpreter: pypy3.11 }
    steps:
      - uses: actions/checkout@v7
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i ${{ matrix.abi.interpreter }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}-${{ matrix.abi.tag }}
          path: dist

  musllinux:
    name: musllinux ${{ matrix.platform.target }} ${{ matrix.abi.name }}
    runs-on: ${{ matrix.platform.runner }}
    continue-on-error: ${{ matrix.abi.tag == 'abi3t' && !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
        abi:
          - { tag: abi3, name: "abi3 (GIL 3.10+)", interpreter: python3.14 }
          - { tag: cp314t, name: "cp314t (free-threaded 3.14)", interpreter: python3.14t }
          - { tag: abi3t, name: "abi3t (3.15+, GIL and free-threaded)", interpreter: python3.15t }
          - { tag: pypy311, name: "pypy3.11", interpreter: pypy3.11 }
    steps:
      - uses: actions/checkout@v7
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i ${{ matrix.abi.interpreter }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}-${{ matrix.abi.tag }}
          path: dist

  windows:
    name: windows ${{ matrix.platform.target }} ${{ matrix.abi.name }}
    runs-on: ${{ matrix.platform.runner }}
    continue-on-error: ${{ matrix.abi.tag == 'abi3t' && !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_arch: x64
          - runner: windows-latest
            target: x86
            python_arch: x86
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
        abi:
          - { tag: abi3, name: "abi3 (GIL 3.10+)", python: "3.14" }
          - { tag: cp314t, name: "cp314t (free-threaded 3.14)", python: "3.14t" }
          - { tag: abi3t, name: "abi3t (3.15+, GIL and free-threaded)", python: "3.15t" }
    steps:
      - uses: actions/checkout@v7
      # setup-python puts the requested build at `python`; Windows has no `python3.14t.exe` to name.
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.abi.python }}
          architecture: ${{ matrix.platform.python_arch }}
          allow-prereleases: true
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.platform.target }}-${{ matrix.abi.tag }}
          path: dist

  macos:
    name: macos ${{ matrix.platform.target }} ${{ matrix.abi.name }}
    runs-on: ${{ matrix.platform.runner }}
    continue-on-error: ${{ matrix.abi.tag == 'abi3t' && !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
        abi:
          - { tag: abi3, name: "abi3 (GIL 3.10+)", python: "3.14" }
          - { tag: cp314t, name: "cp314t (free-threaded 3.14)", python: "3.14t" }
          - { tag: abi3t, name: "abi3t (3.15+, GIL and free-threaded)", python: "3.15t" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.abi.python }}
          allow-prereleases: true
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}-${{ matrix.abi.tag }}
          path: dist

  # emscripten:
  #   runs-on: ${{ matrix.platform.runner }}
  #   strategy:
  #     matrix:
  #       platform:
  #         - runner: ubuntu-22.04
  #           target: wasm32-unknown-emscripten
  #   steps:
  #     - uses: actions/checkout@v6
  #     - run: pip install pyodide-build
  #     - name: Get Emscripten and Python version info
  #       shell: bash
  #       run: |
  #         echo EMSCRIPTEN_VERSION=$(pyodide config get emscripten_version) >> $GITHUB_ENV
  #         echo PYTHON_VERSION=$(pyodide config get python_version | cut -d '.' -f 1-2) >> $GITHUB_ENV
  #         pip uninstall -y pyodide-build
  #     - uses: mymindstorm/setup-emsdk@v14
  #       with:
  #         version: ${{ env.EMSCRIPTEN_VERSION }}
  #         actions-cache-folder: emsdk-cache
  #     - uses: actions/setup-python@v6
  #       with:
  #         python-version: ${{ env.PYTHON_VERSION }}
  #     - run: pip install pyodide-build
  #     - name: Build wheels
  #       uses: PyO3/maturin-action@v1
  #       with:
  #         target: ${{ matrix.platform.target }}
  #         args: --release --out dist -i ${{ env.PYTHON_VERSION }}
  #         sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
  #         rust-toolchain: nightly
  #     - name: Upload wheels
  #       uses: actions/upload-artifact@v6
  #       with:
  #         name: wasm-wheels
  #         path: dist

  # No `-i`: cross-compiled without a host interpreter; the Cargo feature still makes it abi3.
  android:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: aarch64-linux-android
          - runner: ubuntu-latest
            target: x86_64-linux-android
    steps:
      - uses: actions/checkout@v7
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-android-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist
  # Install the built wheels with --no-index: build interpreters select the ABI family, while these
  # target interpreters prove the emitted tags and runtime compatibility on each desktop platform.
  wheel-coverage-linux:
    name: wheel coverage (linux x86_64 target runtimes)
    needs: [linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-linux-x86_64-*
          path: wheels
          merge-multiple: true
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: false
      - name: List built wheels
        run: ls -l wheels
      - name: Install and test every target runtime
        run: |
          for py in 3.10 3.11 3.12 3.13 3.14 3.14t 3.15 3.15t pypy3.11; do
            echo "::group::$py"
            uv venv --python "$py" ".venv-$py"
            VIRTUAL_ENV=".venv-$py" uv pip install --only-binary :all: --no-index --find-links wheels resvg_py
            VIRTUAL_ENV=".venv-$py" uv pip install pytest pyperclip
            VIRTUAL_ENV=".venv-$py" uv run --no-project pytest tests -q
            echo "::endgroup::"
          done

  wheel-coverage-windows:
    name: wheel coverage (windows x64 target runtimes)
    needs: [windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-windows-x64-*
          path: wheels
          merge-multiple: true
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: false
      - name: List built wheels
        run: Get-ChildItem wheels
      - name: Install and test every target runtime
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($py in @("3.10", "3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t")) {
            Write-Output "::group::$py"
            $env:VIRTUAL_ENV = ".venv-$py"
            uv venv --python $py $env:VIRTUAL_ENV
            uv pip install --only-binary :all: --no-index --find-links wheels resvg_py
            uv pip install pytest pyperclip
            uv run --no-project pytest tests -q
            Remove-Item Env:VIRTUAL_ENV
            Write-Output "::endgroup::"
          }

  wheel-coverage-windows-arm64:
    name: wheel coverage (windows arm64 Python ${{ matrix.python }})
    needs: [windows]
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        # Windows ARM64 has no native CPython 3.10 runtime.
        python: ["3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-windows-aarch64-*
          path: wheels
          merge-multiple: true
      # uv has no native managed-Python downloads for Windows ARM64, so pin the target explicitly.
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          architecture: arm64
          allow-prereleases: true
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: false
      - name: List built wheels
        run: Get-ChildItem wheels
      - name: Install and test target runtime
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          uv venv --python python .venv-target
          $env:VIRTUAL_ENV = ".venv-target"
          uv pip install --only-binary :all: --no-index --find-links wheels resvg_py
          uv pip install pytest pyperclip
          uv run --no-project pytest tests -q

  wheel-coverage-macos:
    name: wheel coverage (macos arm64 target runtimes)
    needs: [macos]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-macos-aarch64-*
          path: wheels
          merge-multiple: true
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: false
      - name: List built wheels
        run: ls -l wheels
      - name: Install and test every target runtime
        run: |
          for py in 3.10 3.11 3.12 3.13 3.14 3.14t 3.15 3.15t; do
            echo "::group::$py"
            uv venv --python "$py" ".venv-$py"
            VIRTUAL_ENV=".venv-$py" uv pip install --only-binary :all: --no-index --find-links wheels resvg_py
            VIRTUAL_ENV=".venv-$py" uv pip install pytest pyperclip
            VIRTUAL_ENV=".venv-$py" uv run --no-project pytest tests -q
            echo "::endgroup::"
          done

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs:
      - wheel-coverage-linux
      - wheel-coverage-windows
      - wheel-coverage-windows-arm64
      - wheel-coverage-macos
      - musllinux
      - android
      - sdist
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
      - name: Verify release artifact inventory
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          assert_one_wheel() {
            local artifact=$1
            local wheels=("$artifact"/*.whl)
            if [[ ${#wheels[@]} -ne 1 ]]; then
              echo "::error::$artifact must contain exactly one wheel; found ${#wheels[@]}"
              ls -la "$artifact" || true
              exit 1
            fi
          }

          for target in x86_64 x86 aarch64 armv7 s390x ppc64le; do
            for abi in abi3 cp314t abi3t pypy311; do
              assert_one_wheel "wheels-linux-$target-$abi"
            done
          done
          for target in x86_64 x86 aarch64 armv7; do
            for abi in abi3 cp314t abi3t pypy311; do
              assert_one_wheel "wheels-musllinux-$target-$abi"
            done
          done
          for target in x64 x86 aarch64; do
            for abi in abi3 cp314t abi3t; do
              assert_one_wheel "wheels-windows-$target-$abi"
            done
          done
          for target in x86_64 aarch64; do
            for abi in abi3 cp314t abi3t; do
              assert_one_wheel "wheels-macos-$target-$abi"
            done
          done
          for target in aarch64-linux-android x86_64-linux-android; do
            assert_one_wheel "wheels-android-$target"
          done

          sdists=(wheels-sdist/*.tar.gz)
          wheels=(wheels-*/*.whl)
          release_files=(wheels-*/*)
          if [[ ${#wheels[@]} -ne 57 || ${#sdists[@]} -ne 1 || ${#release_files[@]} -ne 58 ]]; then
            echo "::error::expected exactly 57 wheels and one sdist; found ${#wheels[@]} wheels, ${#sdists[@]} sdists, and ${#release_files[@]} total files"
            exit 1
          fi
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'wheels-*/*'
      - name: Install uv
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: astral-sh/setup-uv@v10.0.0
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: uv publish 'wheels-*/*'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            wasm-wheels/*.whl
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
