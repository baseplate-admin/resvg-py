# Hand-maintained (was `maturin generate-ci github --platform all`; regenerating drops the ABI matrix).
#
# Three forward-compatible ABI families per platform instead of one wheel per CPython version.
# Support still starts at 3.10 — the jobs are named for the family they emit, not for the version
# they happen to build with:
#
#   family   wheel tag          supports                                    built by
#   abi3     cp310-abi3         every GIL CPython 3.10+                     3.14
#   cp314t   cp314-cp314t       free-threaded 3.14 (predates abi3t)         3.14t
#   abi3t    cp315-abi3.abi3t   GIL AND free-threaded 3.15+, and later      3.15t
#
# The abi3 floor is the `abi3-py310` Cargo feature, NOT the build interpreter: 3.14 emits a
# `cp310-abi3` wheel that runs on 3.10, which the abi-coverage job checks on a real 3.10. Building
# with 3.14 rather than 3.10 is deliberate — Windows on ARM has no CPython before 3.11, which is why
# the old per-version matrix silently started at 3.12 there, and building with the oldest supported
# version would reintroduce that per-runner availability problem for no benefit.
#
# PyPy ignores abi3 (pyo3 falls back to version-specific), so it keeps its own leg.
#
# One interpreter per job, never `--find-interpreter`: under abi3 every interpreter in a job emits the
# SAME wheel filename, so the job would rebuild one file N times and same-named wheels from different
# jobs can be concatenated by artifact merging into a ZIP PyPI rejects (CVE-2025-54368 strict parsing).
name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: linux ${{ matrix.platform.target }} ${{ matrix.abi.name }}
    runs-on: ${{ matrix.platform.runner }}
    # 3.15 is still prerelease: only the x86_64/i686 manylinux images ship it, so the abi3t leg is
    # advisory until the rest catch up. Drop this once every image has python3.15t.
    continue-on-error: ${{ matrix.abi.tag == 'abi3t' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
          - runner: ubuntu-22.04
            target: s390x
          - runner: ubuntu-22.04
            target: ppc64le
        # Named for the ABI family produced, not the interpreter that builds it — `abi3` is built by
        # 3.14 but the wheel supports 3.10+.
        abi:
          - { tag: abi3, name: "abi3 (GIL 3.10+)", interpreter: python3.14 }
          - { tag: cp314t, name: "cp314t (free-threaded 3.14)", interpreter: python3.14t }
          - { tag: abi3t, name: "abi3t (3.15+, GIL and free-threaded)", interpreter: python3.15t }
          - { tag: pypy311, name: "pypy3.11", interpreter: pypy3.11 }
    steps:
      - uses: actions/checkout@v7
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist -i ${{ matrix.abi.interpreter }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}-${{ matrix.abi.tag }}
          path: dist

  musllinux:
    name: musllinux ${{ matrix.platform.target }} ${{ matrix.abi.name }}
    runs-on: ${{ matrix.platform.runner }}
    continue-on-error: ${{ matrix.abi.tag == 'abi3t' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
        # Named for the ABI family produced, not the interpreter that builds it — `abi3` is built by
        # 3.14 but the wheel supports 3.10+.
        abi:
          - { tag: abi3, name: "abi3 (GIL 3.10+)", interpreter: python3.14 }
          - { tag: cp314t, name: "cp314t (free-threaded 3.14)", interpreter: python3.14t }
          - { tag: abi3t, name: "abi3t (3.15+, GIL and free-threaded)", interpreter: python3.15t }
          - { tag: pypy311, name: "pypy3.11", interpreter: pypy3.11 }
    steps:
      - uses: actions/checkout@v7
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist -i ${{ matrix.abi.interpreter }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}-${{ matrix.abi.tag }}
          path: dist

  windows:
    name: windows ${{ matrix.platform.target }} ${{ matrix.abi.name }}
    runs-on: ${{ matrix.platform.runner }}
    continue-on-error: ${{ matrix.abi.tag == 'abi3t' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_arch: x64
          - runner: windows-latest
            target: x86
            python_arch: x86
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
        abi:
          - { tag: abi3, name: "abi3 (GIL 3.10+)", python: "3.14" }
          - { tag: cp314t, name: "cp314t (free-threaded 3.14)", python: "3.14t" }
          - { tag: abi3t, name: "abi3t (3.15+, GIL and free-threaded)", python: "3.15t" }
    steps:
      - uses: actions/checkout@v7
      # setup-python installs the requested build as the only `python` on PATH, so `-i python` selects
      # it — including the free-threaded ones, where a `python3.14t.exe` name does not exist on Windows.
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.abi.python }}
          architecture: ${{ matrix.platform.python_arch }}
          allow-prereleases: true
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist -i python
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.platform.target }}-${{ matrix.abi.tag }}
          path: dist

  macos:
    name: macos ${{ matrix.platform.target }} ${{ matrix.abi.name }}
    runs-on: ${{ matrix.platform.runner }}
    continue-on-error: ${{ matrix.abi.tag == 'abi3t' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
        abi:
          - { tag: abi3, name: "abi3 (GIL 3.10+)", python: "3.14" }
          - { tag: cp314t, name: "cp314t (free-threaded 3.14)", python: "3.14t" }
          - { tag: abi3t, name: "abi3t (3.15+, GIL and free-threaded)", python: "3.15t" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.abi.python }}
          allow-prereleases: true
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist -i python
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}-${{ matrix.abi.tag }}
          path: dist

  # emscripten:
  #   runs-on: ${{ matrix.platform.runner }}
  #   strategy:
  #     matrix:
  #       platform:
  #         - runner: ubuntu-22.04
  #           target: wasm32-unknown-emscripten
  #   steps:
  #     - uses: actions/checkout@v6
  #     - run: pip install pyodide-build
  #     - name: Get Emscripten and Python version info
  #       shell: bash
  #       run: |
  #         echo EMSCRIPTEN_VERSION=$(pyodide config get emscripten_version) >> $GITHUB_ENV
  #         echo PYTHON_VERSION=$(pyodide config get python_version | cut -d '.' -f 1-2) >> $GITHUB_ENV
  #         pip uninstall -y pyodide-build
  #     - uses: mymindstorm/setup-emsdk@v14
  #       with:
  #         version: ${{ env.EMSCRIPTEN_VERSION }}
  #         actions-cache-folder: emsdk-cache
  #     - uses: actions/setup-python@v6
  #       with:
  #         python-version: ${{ env.PYTHON_VERSION }}
  #     - run: pip install pyodide-build
  #     - name: Build wheels
  #       uses: PyO3/maturin-action@v1
  #       with:
  #         target: ${{ matrix.platform.target }}
  #         args: --release --out dist -i ${{ env.PYTHON_VERSION }}
  #         sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
  #         rust-toolchain: nightly
  #     - name: Upload wheels
  #       uses: actions/upload-artifact@v6
  #       with:
  #         name: wasm-wheels
  #         path: dist

  # No `-i`: maturin cross-compiles without a host interpreter, and the abi3 Cargo feature makes the
  # result a `cp310-abi3` wheel instead of the previous version-locked one.
  android:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: aarch64-linux-android
          - runner: ubuntu-latest
            target: x86_64-linux-android
    steps:
      - uses: actions/checkout@v7
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-android-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist
  # Guards the claim the matrix rests on: the three ABI wheels together resolve on every interpreter we
  # support, so a dropped leg or a mis-tagged wheel fails here instead of on a user's `pip install`.
  # Installs from the artifact dir with --no-index, so pip tag selection is what picks the wheel.
  abi-coverage:
    name: abi coverage (one wheel set, every interpreter)
    needs: [linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-linux-x86_64-*
          path: wheels
          merge-multiple: true
      - uses: astral-sh/setup-uv@v9.0.0
      - name: List built wheels
        run: ls -l wheels
      - name: Install and run the test suite on every interpreter
        # 3.15/3.15t are omitted: their build leg is advisory while the manylinux images lack the
        # interpreter, so the abi3t wheel is not guaranteed to be present yet.
        run: |
          for py in 3.10 3.11 3.12 3.13 3.14 3.14t pypy3.11; do
            echo "::group::$py"
            uv venv --python "$py" ".venv-$py"
            VIRTUAL_ENV=".venv-$py" uv pip install --no-index --find-links wheels resvg_py
            VIRTUAL_ENV=".venv-$py" uv pip install pytest pyperclip
            VIRTUAL_ENV=".venv-$py" uv run --no-project pytest tests -q
            echo "::endgroup::"
          done

  test:
      needs: [linux, musllinux, windows, macos, android, sdist]
      name: Run Tests
      runs-on: windows-latest
      strategy:
        matrix:
          python-version:
            - '3.10'
            - '3.11'
            - '3.12'
            - '3.13'
            - '3.14'
      steps:
        - uses: actions/checkout@v7
        - name: Set up Python (uv)
          uses: astral-sh/setup-uv@v9.0.0
        - name: Create virtual environment and install dependencies
          run: |
            uv sync
        - name: Run backend tests
          run: |
            uv run pytest -v -x -rs

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [test, abi-coverage]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'wheels-*/*'
      - name: Install uv
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: astral-sh/setup-uv@v9.0.0
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: uv publish 'wheels-*/*'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            wasm-wheels/*.whl
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
