name: dns probe (temporary)
on:
  push:
    branches: [tmp/i686-dns-probe]
permissions: {}
jobs:
  probe:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - run: docker version --format 'docker {{.Server.Version}}'
      - name: Reproducer candidates
        run: |
          set +e
          for img in i386/debian:bookworm i386/debian:buster i386/alpine:3 i386/busybox; do
            case $img in *busybox) cmd="nslookup github.com";; *alpine*) cmd="getent hosts github.com";; *) cmd="getent hosts github.com";; esac
            docker pull -q $img >/dev/null
            docker run --rm $img $cmd >/dev/null 2>&1; a=$?
            docker run --rm --security-opt seccomp=unconfined $img $cmd >/dev/null 2>&1; b=$?
            echo "RESULT $img default=$a unconfined=$b"
          done
